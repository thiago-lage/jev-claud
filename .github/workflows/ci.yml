name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Toda segunda-feira: roda contra o typesafe-sdk mais novo para pegar mudanças cedo.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # O plugin transforma cada teste que falha numa anotação, visível no PR e pela API.
      - run: pip install --upgrade -e ".[dev]" pytest-github-actions-annotate-failures
      - run: pytest --cov --cov-report=term-missing

  offline-only:
    # Garante que o núcleo funciona sem nenhuma dependência (modo custo zero puro).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: jev-claud doctor
      - run: jev-claud ask "Fui cobrado duas vezes" --choice "Qual setor?" -o financeiro=cobrança -o suporte=erro

  installers:
    # Roda os instaladores de uma linha a partir deste checkout, como um usuário novo faria.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      JEV_CLAUD_SPEC: ${{ github.workspace }}[jev]
      JEV_CLAUD_NO_MODIFY_PATH: "1"
      JEV_CLAUD_SKIP_SETUP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          bash -n install.sh
          bash install.sh
          ~/.local/bin/jev-claud --version
          ~/.local/bin/jev-claud setup --check || true
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./install.ps1
          & "$env:USERPROFILE\.local\bin\jev-claud.cmd" --version
          & "$env:USERPROFILE\.local\bin\jev-claud.cmd" setup --check
          exit 0
