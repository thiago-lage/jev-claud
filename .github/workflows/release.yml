name: Release

# Duas formas de lançar uma versão:
#   1. Actions -> Release -> "Run workflow", informando a versão (ex.: 0.5.0). O workflow cria a
#      tag vX.Y.Z e o release com as notas do CHANGELOG.md, anexa o wheel e publica no PyPI.
#      Este é o caminho recomendado.
#   2. Criar o release pela interface do GitHub (tag vX.Y.Z): o workflow publica no PyPI, mas
#      não anexa o wheel (o release já nasce publicado e os releases do repositório são imutáveis).
#
# Releases imutáveis: depois de publicado, nem a tag nem os arquivos do release mudam. Por isso o
# workflow cria o release como rascunho, anexa o wheel e o sdist e só então publica. O GitHub
# gera um atestado do release (`gh release verify vX.Y.Z`), e o wheel ganha um atestado de
# proveniência do build (`gh attestation verify <arquivo> --repo thiago-lage/jev-claud`).
#
# Publicar no PyPI passa pelo ambiente `pypi`, que só aceita a main e tags v* e pede aprovação
# do dono antes de rodar.
#
# Versão antiga (ex.: 0.3.1): informe `target` com o commit e desmarque `publish`; só o release
# no GitHub é criado.
#
# Se o release falhar com "HTTP 403: Resource not accessible by integration", crie um token
# fine-grained (Contents: read and write, só neste repositório) e salve como secret RELEASE_TOKEN.
#
# PyPI por "trusted publishing", sem token guardado no repositório. Configuração única em
# https://pypi.org/manage/account/publishing/ (pending publisher):
#   projeto: jev-claud · dono: thiago-lage · repositório: jev-claud
#   workflow: release.yml · ambiente: pypi

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão sem o v (ex.: 0.5.0)"
        required: true
      target:
        description: "Commit ou branch da tag (padrão: o commit deste disparo)"
        required: false
        default: ""
      publish:
        description: "Construir, anexar o wheel e publicar no PyPI"
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      target: ${{ steps.plan.outputs.target }}
      publish: ${{ steps.plan.outputs.publish }}
      create: ${{ steps.plan.outputs.create }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$EVENT" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"; target="$GITHUB_SHA"; publish=true; create=false
          else
            version="${INPUT_VERSION#v}"; target="${INPUT_TARGET:-$GITHUB_SHA}"; publish="$INPUT_PUBLISH"; create=true
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.]*)?$'; then
            echo "::error::Versão inválida: '$version'"; exit 1
          fi
          {
            echo "version=$version"; echo "target=$target"; echo "publish=$publish"; echo "create=$create"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # assina o atestado de proveniência (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.target }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Confere a versão
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          found=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$found" != "$VERSION" ]; then
            echo "::error::A versão pedida ($VERSION) não bate com o pyproject.toml ($found)."
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Testa o wheel instalado
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          /tmp/wheel-test/bin/jev-claud --version
          /tmp/wheel-test/bin/python -c "from jev_claud import JevClaud, Image, box; print('ok')"
      # Atestado de proveniência: liga o wheel e o sdist a este workflow e a este commit.
      # Quem baixa confere com `gh attestation verify <arquivo> --repo thiago-lage/jev-claud`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  github:
    needs: [plan, build]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # RELEASE_TOKEN (opcional): token pessoal com Contents: read and write neste repositório,
      # para quando o token padrão do Actions não pode criar releases (HTTP 403).
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ needs.plan.outputs.target }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      # O CHANGELOG mais novo, mesmo para versões antigas.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Notas do CHANGELOG
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not match:
              raise SystemExit(f"::error::Seção [{version}] não encontrada no CHANGELOG.md")
          pathlib.Path("notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY
      # Releases imutáveis: o release nasce rascunho (sem tag ainda), recebe os arquivos e só
      # então é publicado; a publicação cria a tag e trava tag e arquivos.
      - name: Cria o release como rascunho
        if: needs.plan.outputs.create == 'true'
        run: |
          # A mensagem do gh vira anotação: fica visível no resumo da execução e pela API.
          if ! out=$(gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$TARGET" \
            --title "v$VERSION" --notes-file notes.md --draft 2>&1); then
            echo "::error title=gh release create::${out//$'\n'/%0A}"
            exit 1
          fi
          echo "$out"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.create == 'true' && needs.build.result == 'success'
        with:
          name: dist
          path: dist/
      - name: Anexa o wheel e o sdist
        if: needs.plan.outputs.create == 'true' && needs.build.result == 'success'
        run: |
          if ! out=$(gh release upload "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber 2>&1); then
            echo "::error title=gh release upload::${out//$'\n'/%0A}"
            exit 1
          fi
      - name: Publica o release
        if: needs.plan.outputs.create == 'true'
        run: |
          latest=$([ "$PUBLISH" = "true" ] && echo true || echo false)
          if ! out=$(gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false \
            --latest="$latest" 2>&1); then
            echo "::error title=gh release edit::${out//$'\n'/%0A}"
            exit 1
          fi
          echo "$out"

  pypi:
    needs: [plan, build, github]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jev-claud/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
