[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jev-claude"
version = "0.6.1"
description = "Decisões estruturadas para o código (TypeSafe Jev) e texto livre para pessoas (LLM), com custo zero por padrão."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Thiago Lage" }]
keywords = ["typesafe", "jev", "system-one", "llm", "routing", "decisions", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# O núcleo não tem dependências: o modo offline, o cache e a escrita via LLM usam só a stdlib.
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7"]
dev = ["typesafe-sdk>=0.7", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
jev-claude = "jev_claude.cli:main"

[project.urls]
Repository = "https://github.com/thiago-lage/jev-claude"
Documentation = "https://github.com/thiago-lage/jev-claude#readme"
Issues = "https://github.com/thiago-lage/jev-claude/issues"
"TypeSafe docs" = "https://docs.typesafe.ai"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Acentos em strings/comentários em português são intencionais; listas de palavras ficam legíveis com split().
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["jev_claude"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["typesafe_sdk", "typesafe_sdk.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["jev_claude"]
branch = true
